name: Deploy auf Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ein Deployment gleichzeitig; laufende Vorgänger werden abgebrochen,
# damit nicht ein älterer Build einen neueren überholt.
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build

      - name: Auf Cloudflare Pages veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=elcon --branch=${{ github.ref_name }}
