name: Deploy auf Cloudflare Pages

# Vorübergehend deaktiviert: Veröffentlicht wird derzeit über GitHub Pages
# (siehe github-pages.yml). Zum Reaktivieren den push-Auslöser wieder
# einkommentieren; von Hand starten lässt sich der Workflow weiterhin.
on:
  # Jeder Branch wird deployt: main geht auf die Produktions-URL,
  # alle anderen bekommen ein Preview-Deployment unter eigener URL.
  # push:
  #   branches: ['**']
  workflow_dispatch:

# Ein Deployment pro Branch; laufende Vorgänger desselben Branches werden
# abgebrochen, damit nicht ein älterer Build einen neueren überholt.
concurrency:
  group: deploy-cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build

      - name: Auf Cloudflare Pages veröffentlichen
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=elcon --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Deployment-URL in der Zusammenfassung ausgeben
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            ART="Produktion"
          else
            ART="Preview"
          fi
          {
            echo "### Cloudflare Pages — $ART"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- URL: ${{ steps.cloudflare.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
